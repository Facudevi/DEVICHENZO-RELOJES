<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 320" width="360" height="320">
  <defs>
    <radialGradient id="fondo" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0" stop-color="#26262f"/>
      <stop offset="1" stop-color="#07070b"/>
    </radialGradient>
    <linearGradient id="titanio" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9dbe0"/>
      <stop offset="0.5" stop-color="#7d8089"/>
      <stop offset="1" stop-color="#3a3c44"/>
    </linearGradient>
    <linearGradient id="correa" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#14141a"/>
      <stop offset="0.5" stop-color="#2b2b35"/>
      <stop offset="1" stop-color="#14141a"/>
    </linearGradient>
    <linearGradient id="oro" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e0b86c"/>
      <stop offset="1" stop-color="#a07a35"/>
    </linearGradient>
    <pattern id="hexagonos" width="24" height="21" patternUnits="userSpaceOnUse" patternTransform="scale(1.1)">
      <path d="M12 0 L24 6 V18 L12 24 L0 18 V6 Z" fill="none" stroke="#c5a059" stroke-width="0.6" opacity="0.16"/>
    </pattern>
  </defs>

  <rect width="360" height="320" fill="url(#fondo)"/>
  <rect width="360" height="320" fill="url(#hexagonos)"/>

  <!-- Correa ultraligera -->
  <rect x="140" y="0" width="80" height="115" fill="url(#correa)"/>
  <rect x="140" y="205" width="80" height="115" fill="url(#correa)"/>
  <g stroke="#3d3d4a" stroke-width="1.2">
    <path d="M150 0 V115 M165 0 V115 M180 0 V115 M195 0 V115 M210 0 V115"/>
    <path d="M150 205 V320 M165 205 V320 M180 205 V320 M195 205 V320 M210 205 V320"/>
  </g>

  <!-- Caja de titanio -->
  <rect x="94" y="80" width="172" height="160" rx="46" fill="url(#titanio)" stroke="#1a1a22" stroke-width="3"/>
  <rect x="106" y="92" width="148" height="136" rx="38" fill="#0b0b10" stroke="#c5a059" stroke-width="2"/>
  <rect x="266" y="146" width="12" height="28" rx="4" fill="url(#oro)"/>

  <!-- Movimiento esqueletado -->
  <circle cx="180" cy="160" r="52" fill="none" stroke="#c5a059" stroke-width="1" opacity="0.5"/>
  <circle cx="180" cy="160" r="40" fill="none" stroke="#3d3d4a" stroke-width="6" stroke-dasharray="3 5"/>
  <g stroke="#e0b86c" stroke-width="1.3" fill="none">
    <circle cx="156" cy="146" r="14"/>
    <circle cx="206" cy="174" r="17"/>
    <circle cx="190" cy="136" r="9"/>
  </g>
  <g fill="#c5a059">
    <circle cx="156" cy="146" r="3"/>
    <circle cx="206" cy="174" r="3.5"/>
    <circle cx="190" cy="136" r="2.5"/>
  </g>

  <!-- Marcas horarias -->
  <g stroke="#f0f0f0" stroke-width="3" stroke-linecap="round">
    <path d="M180 108 V118"/>
    <path d="M180 202 V212"/>
    <path d="M128 160 H138"/>
    <path d="M222 160 H232"/>
  </g>

  <!-- Agujas -->
  <path d="M180 160 L180 124" stroke="#f0f0f0" stroke-width="4" stroke-linecap="round"/>
  <path d="M180 160 L206 178" stroke="#f0f0f0" stroke-width="4" stroke-linecap="round"/>
  <circle cx="180" cy="160" r="5" fill="url(#oro)"/>

  <!-- Reflejo del cristal -->
  <path d="M120 112 Q 150 96 200 98 Q 150 110 124 140 Z" fill="#ffffff" opacity="0.08"/>

  <!-- Etiqueta 2026 -->
  <rect x="236" y="268" width="104" height="34" rx="6" fill="#0d0d0d" stroke="#c5a059" stroke-width="1.5"/>
  <text x="288" y="292" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="bold" letter-spacing="3" fill="#c5a059">2026</text>

  <!-- Detalle: linea ultraligera -->
  <path d="M20 280 H70 M20 292 H50" stroke="#c5a059" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
</svg>
