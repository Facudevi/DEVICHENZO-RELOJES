    <path d="M172 96 H192 V140 H172 Z" opacity="0.9"/>
    <path d="M232 96 H252 V140 H232 Z" opacity="0.9"/>
    <path d="M292 96 H312 L328 140 H292 Z" opacity="0.9"/>
  </g>
  <path d="M32 140 q 14 14 28 0 q 14 14 28 0 q 14 14 28 0 q 14 14 28 0 q 14 14 28 0 q 14 14 28 0 q 14 14 28 0 q 14 14 28 0 q 14 14 28 0 q 14 14 28 0 q 14 14 28 0 q 14 14 28 0 H32 Z" fill="#c5a059"/>

  <!-- Vidrieras -->
  <rect x="50" y="170" width="95" height="90" fill="url(#vidriera)" stroke="#c5a059" stroke-width="3"/>
  <rect x="215" y="170" width="95" height="90" fill="url(#vidriera)" stroke="#c5a059" stroke-width="3"/>
  <circle cx="97" cy="215" r="60" fill="url(#brillo)"/>
  <circle cx="262" cy="215" r="60" fill="url(#brillo)"/>

  <!-- Relojes en las vidrieras -->
  <g>
    <rect x="86" y="190" width="22" height="14" fill="#0d0d0d"/>
    <circle cx="97" cy="215" r="17" fill="#0d0d0d" stroke="#fff" stroke-width="2"/>
    <circle cx="97" cy="215" r="13" fill="#1a1a24"/>
    <path d="M97 215 V205 M97 215 L104 219" stroke="#e0b86c" stroke-width="2" stroke-linecap="round"/>
    <rect x="86" y="228" width="22" height="14" fill="#0d0d0d"/>
    <rect x="62" y="248" width="70" height="4" fill="#0d0d0d" opacity="0.5"/>
