<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 320" width="360" height="320">
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05050a"/>
      <stop offset="1" stop-color="#1a1a24"/>
    </linearGradient>
    <linearGradient id="vidriera" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3d9a0"/>
      <stop offset="1" stop-color="#b8863b"/>
    </linearGradient>
    <linearGradient id="oro" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e0b86c"/>
      <stop offset="1" stop-color="#a07a35"/>
    </linearGradient>
    <radialGradient id="brillo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f3d9a0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f3d9a0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Fondo nocturno -->
  <rect width="360" height="320" fill="url(#cielo)"/>
  <circle cx="300" cy="40" r="3" fill="#f3d9a0"/>
  <circle cx="50" cy="30" r="2" fill="#f3d9a0" opacity="0.7"/>
  <circle cx="120" cy="55" r="1.5" fill="#f3d9a0" opacity="0.6"/>
  <circle cx="240" cy="25" r="1.5" fill="#f3d9a0" opacity="0.6"/>

  <!-- Fachada -->
  <rect x="30" y="70" width="300" height="220" fill="#14141c" stroke="#2a2a38" stroke-width="2"/>
  <rect x="30" y="70" width="300" height="26" fill="#0d0d12"/>
  <rect x="120" y="76" width="120" height="14" rx="2" fill="url(#oro)"/>
  <rect x="130" y="81" width="100" height="4" rx="2" fill="#0d0d0d" opacity="0.55"/>

  <!-- Toldo -->
  <path d="M20 96 H340 L328 140 H32 Z" fill="#0d0d0d" stroke="#c5a059" stroke-width="2"/>
  <g fill="#c5a059">
