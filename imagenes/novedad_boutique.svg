    <path d="M0 0 L22 -14 L22 14 Z" fill="#e0b86c" stroke="#8c6d2f" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="6" fill="#c5a059" stroke="#8c6d2f" stroke-width="1.5"/>
  </g>

  <!-- Guirnalda de luces -->
  <path d="M10 60 Q 90 100 180 62 Q 270 100 350 60" fill="none" stroke="#3a3a48" stroke-width="2"/>
  <g fill="#f3d9a0">
