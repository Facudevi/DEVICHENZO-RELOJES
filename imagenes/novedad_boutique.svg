    <circle cx="80" cy="86" r="4"/>
    <circle cx="125" cy="80" r="4"/>
    <circle cx="180" cy="62" r="4"/>
    <circle cx="235" cy="80" r="4"/>
    <circle cx="280" cy="86" r="4"/>
    <circle cx="320" cy="76" r="4"/>
  </g>

  <!-- Acera -->
  <rect x="0" y="290" width="360" height="30" fill="#0d0d12"/>
  <rect x="0" y="290" width="360" height="3" fill="#c5a059" opacity="0.6"/>
