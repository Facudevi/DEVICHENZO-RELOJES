  <g>
    <rect x="251" y="190" width="22" height="14" fill="#0d0d0d"/>
    <circle cx="262" cy="215" r="17" fill="#0d0d0d" stroke="#fff" stroke-width="2"/>
    <circle cx="262" cy="215" r="13" fill="#1a1a24"/>
    <path d="M262 215 L268 209 M262 215 V226" stroke="#e0b86c" stroke-width="2" stroke-linecap="round"/>
    <rect x="251" y="228" width="22" height="14" fill="#0d0d0d"/>
    <rect x="227" y="248" width="70" height="4" fill="#0d0d0d" opacity="0.5"/>
  </g>

