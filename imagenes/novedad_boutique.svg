  <path d="M30 238 Q 90 230 152 236 L 208 236 Q 270 230 330 238 L 330 250 Q 270 242 208 248 L 152 248 Q 90 242 30 250 Z" fill="#c5a059" stroke="#8c6d2f" stroke-width="1"/>
  <g transform="translate(180 242)">
